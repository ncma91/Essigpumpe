; Essig-Belüftung – PlatformIO-Konfiguration (ESP32-C3 SuperMini)
;
; Build:   pio run
; Upload:  pio run -t upload
; Monitor: pio device monitor

[platformio]
default_envs = esp32c3

[env:esp32c3]
; pioarduino: Arduino-ESP32-Core 3.x (die Pumpe nutzt die 3.x-LEDC-API
; ledcAttach/ledcWrite, die offizielle espressif32-Plattform bringt noch 2.x)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
; der SuperMini hat kein eigenes Board-Profil, das DevKitM-1-Profil passt
board = esp32-c3-devkitm-1
monitor_speed = 115200
build_flags =
    ; der SuperMini hat keinen USB-UART-Wandler: Serial läuft über den
    ; nativen USB-Port (USB-Serial/JTAG)
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
