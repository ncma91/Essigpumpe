; Essig-Belüftung – PlatformIO-Konfiguration
;
; Build:   pio run                  (Standard: ESP32-C6)
;          pio run -e esp32c3       (falls es doch ein ESP32-C3 ist)
; Upload:  pio run -t upload
; Monitor: pio device monitor

[platformio]
default_envs = esp32c6

[env]
; pioarduino: Arduino-ESP32-Core 3.x (die offizielle espressif32-Plattform
; unterstützt Arduino auf dem C6 nur eingeschränkt)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
build_flags =
    ; Serial über den nativen USB-Port (USB-Serial/JTAG) ausgeben
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
    arduino-libraries/LiquidCrystal@^1.0.7

[env:esp32c6]
board = esp32-c6-devkitc-1

[env:esp32c3]
board = esp32-c3-devkitm-1
